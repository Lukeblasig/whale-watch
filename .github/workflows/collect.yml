name: Collect whale bets

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-run the Polymarket backfill"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Get saved data
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: store

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect
        env:
          STORE: store
          BACKFILL: ${{ inputs.backfill }}
        run: node collect.mjs

      - name: Save data
        run: |
          cd store
          rm -rf .git
          git init -q -b data
          git config user.name "whale-watch-bot"
          git config user.email "whale-watch-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Whale log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

name: Collect whale bets

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-run the Polymarket backfill"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: node collect.mjs
      - name: Save
        run: |
          git config user.name "whale-watch-bot"
          git config user.email "whale-watch-bot@users.noreply.github.com"
          git add data
          git commit -m "Update whale log" || exit 0
          git pull --rebase
          git push

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Trader · Whale Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script>try{var s=JSON.parse(localStorage.getItem("ww-state"));if(s&&s.theme==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<style>
/* Same deep-water palette as Whale Watch. The one loud thing on the page is the tide: the profit line in the top panel. */
:root{
  --bg:#0A1430; --panel:#122150; --panel2:#18295E; --ink:#EEF3FF; --muted:#97A6D1; --line:#26386F;
  --sea:#2BD9FF; --win:#3BE38A; --loss:#FF6B5E; --wait:#FFC24B; --on-sea:#05213A;
  --num:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"Archivo",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EAF2FF; --panel:#FFFFFF; --panel2:#F2F6FF; --ink:#0B1638; --muted:#53618A; --line:#D2DDF3;
  --sea:#0088C7; --win:#0E9F57; --loss:#E0413A; --wait:#B7791F; --on-sea:#fff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--body);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:4px}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 64px}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font:700 46px/.9 var(--num);margin:0;letter-spacing:-.5px}
.lede{color:var(--muted);margin:8px 0 0;max-width:52ch;font-size:14px}
.acts{display:flex;gap:8px}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 14px var(--body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--sea)}
.status{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 14px}
.status span{display:inline-flex;align-items:center;gap:7px}
.status span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--win)}
.status .warn::before{background:var(--wait)} .status .bad{color:var(--ink)} .status .bad::before{background:var(--loss)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:0 0 14px}
.panel > h2{font:700 22px/1 var(--num);margin:0;padding:16px 18px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;letter-spacing:.2px}
.panel > h2 small{font:500 13px var(--body);color:var(--muted)}

/* the tide */
.tide{display:grid;grid-template-columns:minmax(170px,auto) 1fr;gap:6px 22px;padding:20px 18px 14px;align-items:end}
.big{font:700 72px/.85 var(--num);letter-spacing:-1px}
.big small{font-size:34px;margin-left:2px}
.facts{display:grid;gap:2px;margin-top:10px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.pos{color:var(--win)} .neg{color:var(--loss)}
.plot{position:relative}
.plot svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:-4px;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;display:none}
.flat{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
@media (max-width:620px){.tide{grid-template-columns:1fr}.big{font-size:60px}}

/* ledger rows */
.rows{list-style:none;margin:0;padding:0 8px 8px}
.r{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:11px 10px;border-top:1px solid var(--line)}
.r:first-child{border-top:0}
.when{grid-row:span 2;font:700 18px/1 var(--num);color:var(--muted)}
.when.soon{color:var(--wait)}
.mark{grid-row:span 2;font:700 20px/1 var(--num);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.mark.W{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.mark.L{background:color-mix(in srgb,var(--loss) 18%,transparent);color:var(--loss)}
.mark.P{background:var(--panel2);color:var(--muted)}
.r.done{grid-template-columns:34px minmax(0,1fr) auto}
.pick{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick em{font-style:normal;color:var(--muted);font-weight:500}
.sub{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{grid-row:span 2;text-align:right;font:700 22px/1 var(--num)}
.right small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:4px}
.right .waiting{color:var(--wait)}
.empty{color:var(--muted);font-size:14px;padding:6px 18px 18px;margin:0}
.more{display:block;margin:0 auto 14px}

/* by filter */
.tbl{overflow-x:auto;padding:0 8px 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
thead th{border-top:0;font-size:12px;font-weight:600;color:var(--muted)}
th:first-child,td:first-child{text-align:left;white-space:normal}
td small{display:block;color:var(--muted);font-size:12px}

/* details */
details.panel > summary{cursor:pointer;list-style:none;padding:14px 18px;font:700 20px/1 var(--num);display:flex;justify-content:space-between;align-items:center}
details.panel > summary::-webkit-details-marker{display:none}
details.panel > summary::after{content:"+";font:600 22px var(--body);color:var(--muted)}
details[open].panel > summary::after{content:"–"}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
@media (max-width:620px){.grid{grid-template-columns:1fr 1fr}}
.cell{background:var(--panel);padding:12px 18px}
.cell b{display:block;font:700 26px/1.1 var(--num)}
.cell span{font-size:13px;color:var(--muted)}
.dsec{padding:14px 18px;border-top:1px solid var(--line)}
.dsec h3{margin:0 0 8px;font-size:14px}
.gate{display:flex;gap:10px;align-items:baseline;font-size:14px;padding:3px 0}
.gate i{font-style:normal;font-weight:700;font-size:12px;min-width:60px;color:var(--muted)}
.gate i.pass{color:var(--win)} .gate i.fail{color:var(--loss)}
.gate span{color:var(--muted)}
.skips{display:grid;gap:4px;font-size:14px}
.skips div{display:flex;justify-content:space-between;gap:10px}
.skips span{color:var(--muted)}
footer{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
@media (max-width:520px){
  .r{grid-template-columns:58px minmax(0,1fr) auto;gap:2px 10px;padding:10px 8px}
  .when{font-size:16px}
  th,td{padding:8px 6px}
  .wl{display:none}
}
@media (prefers-reduced-motion:no-preference){ .line{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s ease-out forwards} @keyframes draw{to{stroke-dashoffset:0}} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Paper Trader</h1>
      <p class="lede" id="lede">Paper money only. Loading the bot's log…</p>
    </div>
    <div class="acts">
      <a class="btn" href="./">Whale Watch</a>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
  </header>
  <div class="status" id="status" aria-live="polite"></div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script src="filters.js"></script>
<script src="bot/stats.js"></script>
<script>
"use strict";
const F = window.WWFilters, W = window.WWStats;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sg = (x, d = 1) => x == null || !isFinite(x) ? "–" : (x > 0 ? "+" : "") + x.toFixed(d);
const cls = x => x > 0 ? "pos" : x < 0 ? "neg" : "";
const pc = p => p == null ? "–" : Math.round(p * 100) + "¢";
const now = () => Date.now() / 1000;
const ago = t => { const m = Math.round((now() - t) / 60); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };
const until = t => { const m = Math.round((t - now()) / 60); return m < 60 ? m + "m" : m < 1440 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : Math.round(m / 1440) + "d"; };
const day = t => new Date(t * 1000).toLocaleString([], { timeZone: "America/Chicago", month: "short", day: "numeric" });
const ruleName = id => (F.RULES.get(id) || {}).name || id;

// The bot writes its log to the bot-log branch. ?log=<url/> points the page at another copy (for testing).
function logBase(){
  const q = new URLSearchParams(location.search).get("log");
  if (q) return q.endsWith("/") ? q : q + "/";
  if (location.hostname.endsWith(".github.io")){
    const owner = location.hostname.split(".")[0], repo = location.pathname.split("/").filter(Boolean)[0];
    if (repo) return `https://raw.githubusercontent.com/${owner}/${repo}/bot-log/`;
  }
  return "botlog/";
}
async function getJ(u, text){ const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return text ? r.text() : r.json(); }

let D = null, shown = 15, lastUpdated = null, decisions = null;
async function load(){
  const base = logBase();
  $("#refresh").disabled = true;
  try {
    const summary = await getJ(base + "summary.json");
    // nothing new since the last look: leave the page alone
    if (D && summary.updated === lastUpdated){ $("#refresh").disabled = false; return; }
    const [state, baseline] = await Promise.all([getJ(base + "state.json"), getJ(base + "baseline.json").catch(() => null)]);
    D = { summary, orders: state.orders || [], baseline, cfg: summary.config };
    lastUpdated = summary.updated; decisions = null;
    render();
  } catch(e){
    $("#status").innerHTML = `<span class="bad">Couldn't load the bot's log (${esc(e.message)})</span>`;
    if (!D) $("#main").innerHTML = `<div class="panel"><p class="empty" style="padding:18px">No log yet. It appears after the first paper run, which follows the next collector save.</p></div>`;
  }
  $("#refresh").disabled = false;
}

function render(){
  const { summary: s, orders, cfg } = D;
  const real = orders.filter(o => !o.shadow);
  const rec = W.record(real);
  const A = cfg.autoBest;
  $("#lede").textContent = cfg.autoPicked
    ? `Paper money only. Bets 1 unit on every Best filter at ${sg(A.minNetRoiPct, 0)}% or better after fees (${cfg.filters.length} right now), the moment it fires, once per bet, ${pc(cfg.checks.minPrice)}–${pc(cfg.checks.maxPrice)}.`
    : `Paper money only. Trading ${cfg.filters.map(ruleName).join(", ")}.`;

  const lr = s.lastRun || {}, runAge = lr.at ? (now() - lr.at) / 60 : null;
  const st = [];
  st.push(!lr.at ? `<span class="warn">Waiting for the first run</span>`
    : `<span class="${lr.status === "ok" && runAge < 45 ? "" : lr.status === "error" ? "bad" : "warn"}">Last run ${ago(lr.at)}${lr.status && lr.status !== "ok" ? ": " + esc(lr.status) : ""}</span>`);
  if (s.killSwitch) st.push(`<span class="bad">Kill switch on: no new bets</span>`);
  if (s.lossStop) st.push(`<span class="bad">Loss stop hit: paused</span>`);
  $("#status").innerHTML = st.join("");

  const open = real.filter(o => (o.status === "filled" || o.status === "resting") && o.start > now()).sort((a, b) => a.start - b.start);
  const live = real.filter(o => o.status === "filled" && o.start <= now());
  const done = real.filter(o => o.status === "settled").sort((a, b) => b.settledAt - a.settledAt);

  $("#main").innerHTML = `
  <section class="panel" aria-label="Profit">
    <div class="tide">
      <div>
        <div class="big ${cls(rec.netUnits)}">${rec.settled ? sg(rec.netUnits) : "0.0"}<small>u</small></div>
        <div class="facts">
          <span><b class="${cls(rec.netRoi)}">${rec.netRoi == null ? "–" : sg(rec.netRoi) + "%"}</b> ROI after fees</span>
          <span><b>${rec.w}-${rec.l}${rec.p ? "-" + rec.p : ""}</b> on ${rec.settled} settled</span>
          <span><b>${open.length + live.length}</b> waiting on games</span>
        </div>
      </div>
      <div class="plot" id="tide"></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-open">
    <h2 id="h-open">Open bets <small>${open.length} before the start${live.length ? `, ${live.length} in play` : ""}</small></h2>
    ${open.length || live.length ? `<ul class="rows">${[...open, ...live].map(openRow).join("")}</ul>` : `<p class="empty">Nothing open. New bets show up after the next collector save, when a Best filter fires.</p>`}
  </section>

  <section class="panel" aria-labelledby="h-done">
    <h2 id="h-done">Settled <small>newest first</small></h2>
    ${done.length ? `<ul class="rows">${done.slice(0, shown).map(doneRow).join("")}</ul>${done.length > shown ? `<button class="btn more" id="more" type="button">Show ${Math.min(30, done.length - shown)} more</button>` : ""}` : `<p class="empty">No results yet. Bets settle a few hours after their games end.</p>`}
  </section>

  <section class="panel" aria-labelledby="h-rules">
    <h2 id="h-rules">By filter <small>paper results next to each filter's history</small></h2>
    ${byFilter(real)}
  </section>

  <details class="panel" id="more-numbers">
    <summary>More numbers</summary>
    ${moreNumbers(s, rec, real)}
  </details>`;
  drawTide(real);
  $("#foot").innerHTML = `Paper money, no real orders. Fills are at the whale's price + ${cfg.checks.maxPriceRiseCents}¢ at most, no bets within ${cfg.checks.startCutoffMinutes} min of the start, fees of ${cfg.fees.Polymarket} on Polymarket and ${cfg.fees.Kalshi} on Kalshi. Settings live in bot/config.json. Updated ${ago(s.updated)}.`;
}

function openRow(o){
  const started = o.start <= now(), soon = !started && o.start - now() < 3600;
  const right = o.status === "resting"
    ? `<span class="waiting">${pc(o.limitPrice)}</span><small>waiting for price</small>`
    : `${pc(o.fillPrice)}<small>whale ${pc(o.whale.q)}</small>`;
  return `<li class="r"><span class="when ${soon ? "soon" : ""}">${started ? "Live" : until(o.start)}</span>
    <span class="pick">${esc(o.name)} <em>${esc(o.league)}</em></span><span class="right">${right}</span>
    <span class="sub">${esc(o.title)}, ${esc(ruleName(o.rule))}</span></li>`;
}
function doneRow(o){
  const r = o.result === "W" || o.result === "L" ? o.result : "P";
  return `<li class="r done"><span class="mark ${r}" aria-label="${r === "W" ? "Win" : r === "L" ? "Loss" : "Push"}">${r}</span>
    <span class="pick">${esc(o.name)} <em>@ ${pc(o.fillPrice)}</em></span><span class="right ${cls(o.units)}">${sg(o.units, 2)}u<small>${day(o.settledAt)}</small></span>
    <span class="sub">${esc(o.title)}, ${esc(ruleName(o.rule))}</span></li>`;
}
function byFilter(real){
  const { baseline } = D;
  const ids = [...new Set(real.map(o => o.rule))];
  if (!ids.length) return `<p class="empty">Each filter's paper record shows here once it has a bet.</p>`;
  const rows = ids.map(id => ({ id, r: W.record(real.filter(o => o.rule === id)), b: baseline && baseline.filters && baseline.filters[id] }))
    .sort((a, b) => b.r.orders - a.r.orders);
  return `<div class="tbl"><table><thead><tr><th>Filter</th><th>Bets</th><th class="wl">W-L</th><th>Paper ROI</th><th>History</th></tr></thead><tbody>
    ${rows.map(({ id, r, b }) => `<tr><td>${esc(ruleName(id))}</td><td>${r.orders}${r.open ? `<small>${r.open} open</small>` : ""}</td><td class="wl">${r.w}-${r.l}</td>
      <td class="${cls(r.netRoi)}">${r.netRoi == null ? "–" : sg(r.netRoi) + "%"}</td>
      <td>${b && b.net != null ? `<span class="${cls(b.net)}">${sg(b.net)}%</span><small>${b.n} bets</small>` : "–"}</td></tr>`).join("")}
    </tbody></table></div>`;
}
function moreNumbers(s, rec, real){
  const L = D.cfg.limits, dd = s.drawdown || {};
  const todayK = W.dayKey(now());
  const todayU = real.filter(o => ["resting", "filled", "settled"].includes(o.status) && W.dayKey(o.createdAt) === todayK).length;
  const openU = real.filter(o => o.status === "filled" || o.status === "resting").length;
  const started = real.length ? Math.min(...real.map(o => o.createdAt)) : null;
  const gates = W.gates(rec, D.cfg.trialGates, started, now());
  return `<div class="grid">
      <div class="cell"><b class="${cls(rec.clvAvgCents)}">${rec.clvAvgCents == null ? "–" : sg(rec.clvAvgCents, 2) + "¢"}</b><span>beat the closing price by, on average${rec.clvN ? ` (${rec.clvN} bets)` : ""}</span></div>
      <div class="cell"><b class="${cls(rec.whaleRoi)}">${rec.whaleRoi == null ? "–" : sg(rec.whaleRoi) + "%"}</b><span>ROI at the whale's price, before fees</span></div>
      <div class="cell"><b>${rec.medianSlipCents == null ? "–" : sg(rec.medianSlipCents, 1) + "¢"}</b><span>our fill vs the whale's, median</span></div>
      <div class="cell"><b>${openU} / ${L.maxOpenUnits}</b><span>open bets / limit</span></div>
      <div class="cell"><b>${todayU} / ${L.maxUnitsPerDay}</b><span>bets today / daily limit</span></div>
      <div class="cell"><b class="${(dd.current || 0) > 0 ? "neg" : ""}">${(dd.current || 0).toFixed(1)}u</b><span>below the high point (pauses at ${L.lossStopUnits}u)</span></div>
    </div>
    <div class="dsec"><h3>Stop rules</h3>${gates.map(g => `<div class="gate"><i class="${g.status}">${g.status === "pass" ? "Pass" : g.status === "fail" ? "Stop" : "Waiting"}</i><div>${esc(g.label)} <span>${esc(g.detail)}</span></div></div>`).join("")}</div>
    <div class="dsec"><h3>Why bets were skipped</h3><div class="skips" id="skips"><span>Loading…</span></div></div>`;
}
// The decision log is only needed here, so it loads when "More numbers" opens
async function loadSkips(){
  if (!decisions){
    const base = logBase(), m = new Date(), cur = m.toISOString().slice(0, 7), prev = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() - 1, 1)).toISOString().slice(0, 7);
    const logs = await Promise.all([prev, cur].map(k => getJ(base + `decisions/${k}.jsonl`, true).catch(() => "")));
    decisions = logs.join("\n").split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch(e){ return null; } }).filter(Boolean);
  }
  const start = Math.min(...D.orders.filter(o => !o.shadow).map(o => o.createdAt), now());
  const reasons = {};
  decisions.filter(d => d.type === "skip" && !d.shadow && d.t >= start - 60).forEach(d => {
    const k = /^price fell/.test(d.reason) ? "price fell below the whale's" : /under|over/.test(d.reason) && /¢/.test(d.reason) ? "outside 10¢–90¢" : d.reason.replace(/\d+(\.\d+)?/g, "#");
    reasons[k] = (reasons[k] || 0) + 1; });
  const rs = Object.entries(reasons).sort((a, b) => b[1] - a[1]);
  const el = $("#skips"); if (!el) return;
  el.innerHTML = rs.length ? rs.map(([k, n]) => `<div><span>${esc(k)}</span><b>${n}</b></div>`).join("") : `<span>No skips yet.</span>`;
}

/* the tide: running profit, green above zero, coral below */
function drawTide(real){
  const el = $("#tide"), c = W.curve(real);
  if (c.length < 2){ el.innerHTML = `<div class="flat">The profit line starts after two bets settle.</div>`; return; }
  const pts = [{ t: c[0].t, net: 0 }, ...c];
  const Wd = Math.max(280, Math.round(el.clientWidth || 520)), H = 170, pl = 6, pr = 44, pt = 10, pb = 22;
  let lo = Math.min(0, ...pts.map(p => p.net)), hi = Math.max(0, ...pts.map(p => p.net)); if (hi === lo) hi = lo + 1;
  const pad = (hi - lo) * .08; lo -= pad; hi += pad;
  const x = i => pl + i / (pts.length - 1) * (Wd - pl - pr), y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb), y0 = y(0);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.net).toFixed(1)}`).join(" ");
  const area = `${x(0)},${y0} ${line} ${x(pts.length - 1)},${y0}`;
  const end = pts[pts.length - 1].net, len = Math.round(Wd * 2.2);
  el.innerHTML = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Running profit over ${pts.length - 1} settled bets, now ${sg(end)} units">
    <defs><clipPath id="up"><rect x="0" y="0" width="${Wd}" height="${y0}"/></clipPath><clipPath id="dn"><rect x="0" y="${y0}" width="${Wd}" height="${H - y0}"/></clipPath></defs>
    <polygon points="${area}" fill="var(--win)" fill-opacity=".16" clip-path="url(#up)"/>
    <polygon points="${area}" fill="var(--loss)" fill-opacity=".16" clip-path="url(#dn)"/>
    <line x1="${pl}" x2="${Wd - pr}" y1="${y0}" y2="${y0}" stroke="var(--line)" stroke-width="1.5"/>
    <text x="${Wd - pr + 6}" y="${y0 + 4}" font-size="11" fill="var(--muted)">0u</text>
    <polyline class="line" style="--len:${len}" points="${line}" fill="none" stroke="${end >= 0 ? "var(--win)" : "var(--loss)"}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(end)}" r="4" fill="${end >= 0 ? "var(--win)" : "var(--loss)"}"/>
    <text x="${Wd - pr + 6}" y="${y(end) + 4}" font-size="12" font-weight="700" fill="var(--ink)">${sg(end)}u</text>
    <text x="${pl}" y="${H - 5}" font-size="11" fill="var(--muted)">${day(pts[0].t)}</text>
    <text x="${Wd - pr}" y="${H - 5}" font-size="11" fill="var(--muted)" text-anchor="end">${pts.length - 1} bets</text>
    <rect x="${pl}" y="0" width="${Wd - pl - pr}" height="${H}" fill="transparent"/>
  </svg><div class="tip"></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip");
  const show = ev => { const r = svg.getBoundingClientRect(), fx = (ev.clientX - r.left) / r.width * Wd;
    const i = Math.max(1, Math.min(pts.length - 1, Math.round((fx - pl) / (Wd - pl - pr) * (pts.length - 1))));
    tip.innerHTML = `Bet ${i}, ${day(pts[i].t)}: <b>${sg(pts[i].net)}u</b>`; tip.style.display = "block";
    tip.style.left = Math.min(r.width - tip.offsetWidth, Math.max(0, x(i) / Wd * r.width - tip.offsetWidth / 2)) + "px"; };
  svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", () => tip.style.display = "none");
}

document.addEventListener("click", e => { if (e.target.id === "more"){ shown += 30; render(); } });
document.addEventListener("toggle", e => { if (e.target.id === "more-numbers" && e.target.open) loadSkips(); }, true);
$("#refresh").addEventListener("click", () => { lastUpdated = null; load(); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (D) drawTide(D.orders.filter(o => !o.shadow)); }, 150); });
load();
setInterval(() => { if (!document.hidden) load(); }, 120000);
</script>
</body>
</html>
